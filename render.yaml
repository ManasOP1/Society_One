# Render Blueprint — SocietyOne API (NestJS)
# Repo: https://github.com/ManasOP1/Society_One
# Dashboard: set Root Directory to "api" if not using this blueprint.
#
# CRITICAL: Free plan sleeps after ~15 min idle → 30–50s cold starts on login.
# Use starter (or higher) for production so admin + mobile stay responsive.
# Optional free-tier workaround: ping GET /api/v1/health every 10–14 min (UptimeRobot).
#
# After first deploy, set these in Render Dashboard → Environment:
#   CORS_ORIGINS=https://societyoneadmin-one.vercel.app,https://society-one_expo.app
#   ADMIN_PUBLIC_URL=https://societyoneadmin-one.vercel.app
#   REDIS_URL=rediss://... (Upstash) — required for billing/PDF/push queues
# Do NOT leave CORS_ORIGINS blank (empty string disables all browser origins).

services:
  - type: web
    name: societyone-api
    runtime: node
    rootDir: api
    plan: starter
    # Render builds run with production env, so explicitly include devDependencies
    # for Nest/TypeScript/Prisma build tooling.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: API_PREFIX
        value: api/v1
      - key: RAZORPAY_ENABLED
        value: "false"
      - key: APP_PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Secrets (set in dashboard): DATABASE_URL, JWT_*, SUPABASE_*, REDIS_URL
